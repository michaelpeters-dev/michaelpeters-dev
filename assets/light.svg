<text x="430.0" y="44" class="d" text-anchor="middle">Systems Programmer's Manual</text>
<text x="830" y="44" class="d" text-anchor="end">MICHAEL(7)</text>
<text x="30" y="83" class="s">NAME</text>
<text x="92" y="106"><tspan class="s">michael peters</tspan> - systems engineer; cs + math at georgia tech</text>
<text x="30" y="142" class="s">SYNOPSIS</text>
<text x="92" y="165"><tspan class="s">michael</tspan> [<tspan class="a">--rust</tspan>] [<tspan class="a">--c++</tspan>] [<tspan class="a">--x86-asm</tspan>] [<tspan class="a">--mlir</tspan>] <tspan class="u">problem</tspan> ...</text>
<text x="30" y="201" class="s">DESCRIPTION</text>
<text x="92" y="224">Builds the layers other software stands on: query engines,</text>
<text x="92" y="247">compilers, order books and bootloaders. Mostly Rust and C++,</text>
<text x="92" y="270">sometimes x86 assembly. Tuned against benchmarks, not intuition.</text>
<text x="30" y="306" class="s">SEE ALSO</text>
<text x="92" y="329"><tspan class="s">rustc</tspan>(1), <tspan class="s">clang</tspan>(1), <tspan class="s">nasm</tspan>(1), <tspan class="s">qemu</tspan>(1), <tspan class="s">perf</tspan>(1), <tspan class="s">nvim</tspan>(1)</text>
<rect x="30" y="355" width="530" height="22" fill="#24292f"/>
<text x="36" y="371" class="b">Manual page michael(7) line 1 (press h for help or q to quit)</text>
